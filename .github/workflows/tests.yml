name: Phase 1 tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser test dependency
        run: |
          python -m pip install "pypdf>=5,<8" "openpyxl>=3.1,<4" "reportlab>=4,<5"
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum
      - name: Generate synthetic PDF fixtures
        run: python benchmarks/realform/generate.py
      - name: Python syntax check
        run: python -m compileall -q server.py case_store.py parser.py benchmark.py practical_benchmark.py realform_benchmark.py demo_review.py tests
      - name: JavaScript syntax check
        run: node --check static/app.js
      - name: Run unit and HTTP tests
        env:
          APP_NO_BROWSER: '1'
          AI_MODE: 'off'
        run: python -m unittest discover -s tests -v

      - name: Package Windows source bundle
        if: success()
        run: |
          zip -q -r building-permit-review-agent-v0.2.1.zip . -x '.git/*' 'workspace/*' '__pycache__/*' 'tests/__pycache__/*' '*.pyc'
      - name: Upload release bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: building-on-v021-windows
          path: building-permit-review-agent-v0.2.1.zip
          retention-days: 14
